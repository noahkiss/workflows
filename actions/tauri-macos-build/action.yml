name: Tauri macOS build
description: >-
  Build a Tauri app for Apple Silicon from a checked-out release tag. Checks
  that the tag is a release tag and that HEAD is its commit, checks that
  Cargo.toml and tauri.conf.json state the tag's version, installs Rust, any
  Homebrew packages, pnpm and Node, builds the .app, and checks the bundle's
  CFBundleShortVersionString. Sign the result with macos-sign-notarize and
  publish it with release-attach. `require-tag: false` allows a dry run on a
  branch, and `tauri-args` passes extra arguments to `tauri build`.

inputs:
  tag:
    description: >-
      Release tag, e.g. v1.2.3. Empty means the tag that triggered the run, or
      with require-tag false on a branch, v<tauri.conf.json version>.
    required: false
    default: ''
  require-tag:
    description: >-
      'true' fails unless HEAD is the commit of a release tag. 'false' is for
      a dry run: the tag need not exist and HEAD is not checked against it.
      Never attach the result of a run with 'false'.
    required: false
    default: 'true'
  tauri-args:
    description: >-
      Extra arguments for `tauri build`, one per line, added after
      `--bundles app`; e.g. `--config` and a path on the next line. A line is
      one argument, so a JSON value needs no quoting. The build runs in
      tauri-dir, so a relative path starts there.
    required: false
    default: ''
  app-name:
    description: Bundle name without .app, e.g. MyApp (from productName).
    required: true
  asset-prefix:
    description: The zip is <asset-prefix>-<version>-arm64.zip.
    required: true
  tauri-dir:
    description: Folder holding tauri.conf.json and Cargo.toml.
    required: false
    default: src-tauri
  bundle-path:
    description: The built .app, relative to the workspace. Empty means <tauri-dir>/target/release/bundle/macos/<app-name>.app.
    required: false
    default: ''
  frontend-dir:
    description: Folder holding the frontend's package.json (pnpm). Empty skips Node.
    required: false
    default: app
  node-version-file:
    description: Node version file, relative to the workspace.
    required: false
    default: .node-version
  tauri-command:
    description: Command that runs the Tauri CLI. Empty means <frontend-dir>/node_modules/.bin/tauri.
    required: false
    default: ''
  brew-packages:
    description: Homebrew packages the build or the smoke test needs, space-separated.
    required: false
    default: ''
  check-versions:
    description: Fail unless Cargo.toml and tauri.conf.json both state the tag's version.
    required: false
    default: 'true'
  cache-shared-key:
    description: >-
      rust-cache's shared-key. A cache saved under a tag is visible to that tag
      only, so a release never restores an earlier release's cache. Give a job
      on the default branch that builds the app the same way this same key,
      and the release restores its compiled dependencies. Empty keeps the
      per-job key.
    required: false
    default: ''
  cache-save:
    description: "'false' skips saving the Rust cache; a cache saved under a tag helps no later run."
    required: false
    default: 'true'
  updater-private-key:
    description: >-
      The Tauri updater key, for an app whose config sets createUpdaterArtifacts.
      Passed to the build as TAURI_SIGNING_PRIVATE_KEY; empty passes nothing.
      That archive holds the app before macos-sign-notarize, so release-attach's
      `updater` makes one from the final bundle instead.
    required: false
    default: ''
  updater-private-key-password:
    description: Its password (TAURI_SIGNING_PRIVATE_KEY_PASSWORD); empty for a key without one.
    required: false
    default: ''

outputs:
  tag:
    description: The release tag.
    value: ${{ steps.tag.outputs.tag }}
  version:
    description: The tag without its leading v.
    value: ${{ steps.tag.outputs.version }}
  asset:
    description: File name the zip should get.
    value: ${{ steps.tag.outputs.asset }}
  app:
    description: Path of the built .app bundle.
    value: ${{ steps.bundle.outputs.app }}

runs:
  using: composite
  steps:
    # The caller checks out the tag. This step proves it did, so a build can
    # never ship a commit other than the one the tag names.
    - name: Resolve the tag
      id: tag
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        PREFIX: ${{ inputs.asset-prefix }}
        REQUIRE_TAG: ${{ inputs.require-tag }}
        TAURI_DIR: ${{ inputs.tauri-dir }}
      run: |
        set -euo pipefail
        [ "$RUNNER_OS" = macOS ] || { echo "::error::tauri-macos-build needs a macOS runner"; exit 1; }
        tag="${INPUT_TAG:-}"
        if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          tag="${GITHUB_REF#refs/tags/}"
        fi
        if [ -z "$tag" ]; then
          [ "$REQUIRE_TAG" = false ] || { echo "::error::no tag input and ${GITHUB_REF} is not a tag"; exit 1; }
          tag="v$(jq -r .version "${TAURI_DIR}/tauri.conf.json")"
        fi
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] \
          || { echo "::error::not a release tag: ${tag}"; exit 1; }
        if [ "$REQUIRE_TAG" = false ]; then
          echo "::notice::require-tag is false: building ${tag} from $(git rev-parse --short HEAD) without checking the tag"
        else
          git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null \
            || git fetch --no-tags --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          [ "$tag_sha" = "$head_sha" ] \
            || { echo "::error::HEAD is ${head_sha}, ${tag} is ${tag_sha}; check out the tag (actions/checkout ref: the tag)"; exit 1; }
        fi
        version="${tag#v}"
        {
          echo "tag=${tag}"
          echo "version=${version}"
          echo "asset=${PREFIX}-${version}-arm64.zip"
        } >> "$GITHUB_OUTPUT"

    # The tag must be a release of the version the manifests state, or the
    # app reports one version and the cask installs another.
    - name: Check the manifest versions
      if: inputs.check-versions == 'true'
      shell: bash
      working-directory: ${{ inputs.tauri-dir }}
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        set -euo pipefail
        cargo_v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
        tauri_v="$(jq -r .version tauri.conf.json)"
        [ "$cargo_v" = "$VERSION" ] && [ "$tauri_v" = "$VERSION" ] \
          || { echo "::error::Cargo.toml says ${cargo_v}, tauri.conf.json says ${tauri_v}, tag says ${VERSION}"; exit 1; }

    - name: Install Rust and Homebrew packages
      shell: bash
      env:
        BREW_PACKAGES: ${{ inputs.brew-packages }}
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal
        rustup default stable
        if [ -n "$BREW_PACKAGES" ]; then
          read -ra pkgs <<<"$BREW_PACKAGES"
          brew install "${pkgs[@]}"
        fi

    # rust-cache keeps compiled dependencies only: it removes the workspace's own
    # crates before it saves, so the app itself always builds from this checkout.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.tauri-dir }}
        key: release
        shared-key: ${{ inputs.cache-shared-key }}
        save-if: ${{ inputs.cache-save }}

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.frontend-dir != ''
      with:
        package_json_file: ${{ inputs.frontend-dir }}/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.frontend-dir != ''
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.frontend-dir }}/pnpm-lock.yaml

    - name: Install the frontend
      if: inputs.frontend-dir != ''
      shell: bash
      working-directory: ${{ inputs.frontend-dir }}
      run: pnpm install --frozen-lockfile

    # tauri.conf.json's beforeBuildCommand builds the frontend. The bundle
    # gets the config's own signature (ad-hoc with signingIdentity "-");
    # macos-sign-notarize replaces it with the Developer ID signature.
    - name: Build the app
      shell: bash
      working-directory: ${{ inputs.tauri-dir }}
      env:
        TAURI_COMMAND: ${{ inputs.tauri-command }}
        FRONTEND_DIR: ${{ inputs.frontend-dir }}
        UPDATER_KEY: ${{ inputs.updater-private-key }}
        UPDATER_KEY_PASSWORD: ${{ inputs.updater-private-key-password }}
        TAURI_ARGS: ${{ inputs.tauri-args }}
      run: |
        set -euo pipefail
        if [ -n "$UPDATER_KEY" ]; then
          export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
        fi
        unset UPDATER_KEY UPDATER_KEY_PASSWORD
        cmd="$TAURI_COMMAND"
        [ -n "$cmd" ] || cmd="$GITHUB_WORKSPACE/$FRONTEND_DIR/node_modules/.bin/tauri"
        read -ra tauri <<<"$cmd"
        extra=()
        while IFS= read -r arg; do
          arg="${arg%$'\r'}"
          if [ -n "$arg" ]; then extra+=("$arg"); fi
        done <<<"$TAURI_ARGS"
        "${tauri[@]}" build --bundles app ${extra[@]+"${extra[@]}"}

    - name: Locate the bundle
      id: bundle
      shell: bash
      env:
        BUNDLE_PATH: ${{ inputs.bundle-path }}
        TAURI_DIR: ${{ inputs.tauri-dir }}
        APP_NAME: ${{ inputs.app-name }}
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        set -euo pipefail
        app="${BUNDLE_PATH:-${TAURI_DIR}/target/release/bundle/macos/${APP_NAME}.app}"
        [ -d "$app" ] || { echo "::error::no bundle at ${app}"; exit 1; }
        plist_v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
        [ "$plist_v" = "$VERSION" ] || { echo "::error::bundle says ${plist_v}, tag says ${VERSION}"; exit 1; }
        echo "app=${app}" >> "$GITHUB_OUTPUT"

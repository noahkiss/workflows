name: Komodo deploy
description: >-
  Post a signed synthetic push event to a Komodo webhook listener, so the
  listener redeploys one stack. The one copy of the signing logic: the
  komodo-deploy and ghcr-build-push workflows both run this action. The
  caller gates the branch.

inputs:
  stack:
    description: Name of the Komodo stack to deploy.
    required: true
  listener-url:
    description: >-
      Base URL of the Komodo webhook listener, without a trailing slash, for
      example https://hooks.example.com/listener/github. Never printed.
    required: true
  ref:
    description: Git ref sent in the webhook payload.
    required: false
    default: refs/heads/main
  webhook-secret:
    description: Shared secret the listener verifies. Must match KOMODO_WEBHOOK_SECRET.
    required: true

runs:
  using: composite
  steps:
    - name: Trigger stack deploy
      shell: bash
      env:
        WEBHOOK_SECRET: ${{ inputs.webhook-secret }}
        LISTENER_URL: ${{ inputs.listener-url }}
        STACK: ${{ inputs.stack }}
        PAYLOAD_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        [ -n "$STACK" ] || { echo "::error::stack is empty"; exit 1; }
        [ -n "$LISTENER_URL" ] || { echo "::error::the listener URL is empty: pass the komodo_listener_url secret or the listener_url input"; exit 1; }
        if [ -z "$WEBHOOK_SECRET" ]; then
          echo "::error::webhook_secret is empty. Name it under secrets: in the calling job."
          exit 1
        fi

        payload="{\"ref\":\"${PAYLOAD_REF}\"}"
        sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
        url="${LISTENER_URL%/}/stack/${STACK}/deploy"
        response="$(mktemp)"

        # A CDN or WAF in front of the listener can reject the runner itself,
        # before the request ever reaches the listener. A retry runs on the
        # same runner, so it clears transient edge state but not a block tied
        # to the runner's location; fix those at the edge, not here. Retry
        # only what a second attempt can plausibly fix: a transport error,
        # a 429, a 5xx, or a 403 that carries an HTML error
        # page rather than the listener's own reply. Every other 4xx, a 401
        # above all, is a real answer and must not be repeated.
        max_attempts=2
        backoff=75

        # Never print the URL: a caller may pass it as a secret to keep it out
        # of the log, and the listener host is fleet detail either way.
        echo "POST <listener>/stack/${STACK}/deploy"
        attempt=1
        while true; do
          rc=0
          status=$(curl --silent --location \
            --output "$response" --write-out '%{http_code}' \
            --max-time 60 \
            --request POST "$url" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=${sig}" \
            --data "$payload") || rc=$?

          if [ "$rc" -ne 0 ]; then
            status=000
            echo "Attempt ${attempt}: curl exited ${rc} with no response."
          else
            echo "Attempt ${attempt}: listener responded with HTTP ${status}"
          fi

          if [ "${status#2}" != "$status" ]; then
            echo "Deploy request accepted."
            exit 0
          fi

          retryable=no
          case "$status" in
            000|429|5??) retryable=yes ;;
            403)
              # The listener answers in JSON or plain text. An HTML body on a
              # 403 means something upstream blocked us, not the listener.
              if grep -qiE '<!doctype html|<html' "$response"; then
                retryable=yes
              fi
              ;;
          esac

          if [ "$retryable" = no ] || [ "$attempt" -ge "$max_attempts" ]; then
            break
          fi

          echo "Retrying once in ${backoff}s."
          sleep "$backoff"
          attempt=$((attempt + 1))
        done

        echo "Deploy request failed." >&2
        # An edge error page can name the listener host; mask it.
        host="${LISTENER_URL#*://}"; host="${host%%/*}"
        body="$(head -c 2000 "$response" || true)"
        printf '%s\n' "${body//"$host"/<listener-host>}" >&2
        exit 1

name: Tauri macOS release

# Builds a Tauri app for Apple Silicon from a release tag, signs it with a
# Developer ID identity, notarizes and staples it, zips it, attaches the zip to
# the tag's GitHub Release, and can then bump a Homebrew cask.
#
# Runs on macOS, unlike the other workflows here. macOS minutes are free for
# public repositories and metered at 10x for private ones.
#
# Signing secrets come from a GitHub environment (`environment`, default
# `release`). Limit that environment to `v*` tags so a branch or a pull request
# cannot read them. A job in a called workflow that names an environment reads
# that environment's secrets, so the caller does not pass them.
#
# A re-run never replaces an asset that is already attached: a cask pins the
# sha256 of what was published first, and a rebuilt zip is not byte-identical.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3. Empty means the tag that triggered the run.
        required: false
        type: string
        default: ''
      app-name:
        description: Bundle name without .app, e.g. MyApp (from productName).
        required: true
        type: string
      asset-prefix:
        description: The zip is <asset-prefix>-<version>-arm64.zip.
        required: true
        type: string
      tauri-dir:
        description: Folder holding tauri.conf.json and Cargo.toml.
        required: false
        type: string
        default: src-tauri
      bundle-path:
        description: The built .app, relative to the workspace. Empty means <tauri-dir>/target/release/bundle/macos/<app-name>.app.
        required: false
        type: string
        default: ''
      frontend-dir:
        description: Folder holding the frontend's package.json (pnpm). Empty skips Node.
        required: false
        type: string
        default: app
      node-version-file:
        description: Node version file, relative to the workspace.
        required: false
        type: string
        default: .node-version
      tauri-command:
        description: Command that runs the Tauri CLI. Empty means <frontend-dir>/node_modules/.bin/tauri.
        required: false
        type: string
        default: ''
      brew-packages:
        description: Homebrew packages the build or the smoke test needs, space-separated.
        required: false
        type: string
        default: ''
      check-versions:
        description: Fail unless Cargo.toml and tauri.conf.json both state the tag's version.
        required: false
        type: boolean
        default: true
      smoke-command:
        description: Command run against the signed bundle before it is zipped. $APP holds its path.
        required: false
        type: string
        default: ''
      entitlements:
        description: Entitlements plist, relative to the workspace. Empty for none.
        required: false
        type: string
        default: ''
      signing-identity:
        description: Full Developer ID Application identity. Empty ships the ad-hoc build unsigned by Apple.
        required: false
        type: string
        default: ''
      team-id:
        description: Team ID the signature must carry.
        required: false
        type: string
        default: ''
      notarize:
        description: Notarize and staple after signing.
        required: false
        type: boolean
        default: true
      environment:
        description: GitHub environment holding the signing secrets.
        required: false
        type: string
        default: release
      require-ci-workflow:
        description: Workflow file (e.g. ci.yml) that must have a green run on the tagged commit before anything is attached. Empty skips the check.
        required: false
        type: string
        default: ''
      ci-timeout-minutes:
        description: How long to wait for that run.
        required: false
        type: number
        default: 40
      tap-repo:
        description: Homebrew tap repository to bump, e.g. owner/homebrew-tap. Empty skips the bump.
        required: false
        type: string
        default: ''
      tap-formula:
        description: Formula or cask name the tap's bump workflow rewrites.
        required: false
        type: string
        default: ''
      tap-workflow:
        description: The tap's bump workflow file.
        required: false
        type: string
        default: bump.yml
      runner:
        description: macOS runner label.
        required: false
        type: string
        default: macos-26
    secrets:
      MAC_CERT_P12:
        description: Base64 .p12. Normally read from the environment, not passed.
        required: false
      MAC_CERT_PASSWORD:
        description: The .p12 password.
        required: false
      ASC_KEY_P8:
        description: App Store Connect API key (.p8 PEM text).
        required: false
      ASC_KEY_ID:
        description: The API key's ID.
        required: false
      ASC_ISSUER_ID:
        description: The API key's issuer ID.
        required: false
      tap_token:
        description: "PAT with `actions: write` on the tap. Required when tap-repo is set."
        required: false
    outputs:
      tag:
        description: The release tag.
        value: ${{ jobs.package.outputs.tag }}
      asset:
        description: File name of the attached zip.
        value: ${{ jobs.package.outputs.asset }}

jobs:
  package:
    name: Build, sign and attach
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      actions: read
    concurrency:
      group: tauri-macos-release-${{ github.repository }}-${{ inputs.tag || github.ref }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      asset: ${{ steps.tag.outputs.asset }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PREFIX: ${{ inputs.asset-prefix }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            [[ "$GITHUB_REF" == refs/tags/* ]] || { echo "::error::no tag input and ${GITHUB_REF} is not a tag"; exit 1; }
            tag="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::not a release tag: ${tag}"; exit 1; }
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "asset=${PREFIX}-${version}-arm64.zip"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The tag must be a release of the version the manifests state, or the
      # app reports one version and the cask installs another.
      - name: Check the manifest versions
        if: inputs.check-versions
        working-directory: ${{ inputs.tauri-dir }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cargo_v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tauri_v="$(jq -r .version tauri.conf.json)"
          [ "$cargo_v" = "$VERSION" ] && [ "$tauri_v" = "$VERSION" ] \
            || { echo "::error::Cargo.toml says ${cargo_v}, tauri.conf.json says ${tauri_v}, tag says ${VERSION}"; exit 1; }

      - name: Install Rust and Homebrew packages
        env:
          BREW_PACKAGES: ${{ inputs.brew-packages }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "$BREW_PACKAGES" ]; then
            read -ra pkgs <<<"$BREW_PACKAGES"
            brew install "${pkgs[@]}"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.tauri-dir }}
          key: release

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.frontend-dir != ''
        with:
          package_json_file: ${{ inputs.frontend-dir }}/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.frontend-dir != ''
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend-dir }}/pnpm-lock.yaml

      - name: Install the frontend
        if: inputs.frontend-dir != ''
        working-directory: ${{ inputs.frontend-dir }}
        run: pnpm install --frozen-lockfile

      # tauri.conf.json's beforeBuildCommand builds the frontend. The bundle
      # gets the config's own signature (ad-hoc with signingIdentity "-");
      # the next step replaces it with the Developer ID signature.
      - name: Build the app
        working-directory: ${{ inputs.tauri-dir }}
        env:
          TAURI_COMMAND: ${{ inputs.tauri-command }}
          FRONTEND_DIR: ${{ inputs.frontend-dir }}
        run: |
          set -euo pipefail
          cmd="$TAURI_COMMAND"
          [ -n "$cmd" ] || cmd="$GITHUB_WORKSPACE/$FRONTEND_DIR/node_modules/.bin/tauri"
          read -ra tauri <<<"$cmd"
          "${tauri[@]}" build --bundles app

      - name: Locate the bundle
        id: bundle
        env:
          BUNDLE_PATH: ${{ inputs.bundle-path }}
          TAURI_DIR: ${{ inputs.tauri-dir }}
          APP_NAME: ${{ inputs.app-name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          app="${BUNDLE_PATH:-${TAURI_DIR}/target/release/bundle/macos/${APP_NAME}.app}"
          [ -d "$app" ] || { echo "::error::no bundle at ${app}"; exit 1; }
          plist_v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$plist_v" = "$VERSION" ] || { echo "::error::bundle says ${plist_v}, tag says ${VERSION}"; exit 1; }
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and staple
        if: inputs.signing-identity != ''
        uses: noahkiss/workflows/actions/macos-sign-notarize@main
        with:
          path: ${{ steps.bundle.outputs.app }}
          identity: ${{ inputs.signing-identity }}
          team-id: ${{ inputs.team-id }}
          entitlements: ${{ inputs.entitlements }}
          notarize: ${{ inputs.notarize }}
          certificate-p12: ${{ secrets.MAC_CERT_P12 }}
          certificate-password: ${{ secrets.MAC_CERT_PASSWORD }}
          notary-key-p8: ${{ secrets.ASC_KEY_P8 }}
          notary-key-id: ${{ secrets.ASC_KEY_ID }}
          notary-issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Smoke test and zip
        env:
          APP: ${{ steps.bundle.outputs.app }}
          ASSET: ${{ steps.tag.outputs.asset }}
          SMOKE: ${{ inputs.smoke-command }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$APP"
          if [ -n "$SMOKE" ]; then bash -euo pipefail -c "$SMOKE"; fi
          # ditto keeps the signature, the stapled ticket and the bundle's symlinks.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/$ASSET"
          shasum -a 256 "$GITHUB_WORKSPACE/$ASSET"

      # Callers usually run their tests on every push. The release waits for
      # that run on the tagged commit instead of repeating it. The check sits
      # after the build, so the two overlap, and before anything is attached.
      - name: Require a green CI run on the tagged commit
        if: inputs.require-ci-workflow != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_WORKFLOW: ${{ inputs.require-ci-workflow }}
          TIMEOUT: ${{ inputs.ci-timeout-minutes }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 $((TIMEOUT * 2))); do
            run="$(gh run list --workflow "$CI_WORKFLOW" --commit "$sha" --limit 1 --json status,conclusion,url --jq '.[0] // empty')"
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              [ "$conclusion" = success ] || { echo "::error::${CI_WORKFLOW} on ${sha} ended ${conclusion}: $(jq -r .url <<<"$run")"; exit 1; }
              echo "CI passed: $(jq -r .url <<<"$run")"; exit 0
            fi
            sleep 30
          done
          echo "::error::no finished ${CI_WORKFLOW} run on ${sha} after ${TIMEOUT} minutes"; exit 1

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET: ${{ steps.tag.outputs.asset }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          # Never clobber. A cask pins the sha256 of whatever was attached first.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "::notice::${ASSET} is already attached to ${TAG}; keeping the published one"
            exit 0
          fi
          gh release upload "$TAG" "$ASSET"

  tap-inputs:
    name: Tap bump inputs
    needs: package
    if: inputs.tap-repo != ''
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      json: ${{ steps.json.outputs.json }}
    steps:
      - id: json
        env:
          FORMULA: ${{ inputs.tap-formula }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$FORMULA" ] || { echo "::error::tap-formula is required with tap-repo"; exit 1; }
          echo "json=$(jq -cn --arg formula "$FORMULA" --arg tag "$TAG" '{formula: $formula, tag: $tag}')" >> "$GITHUB_OUTPUT"

  # Fire the tap's bump and fail unless it lands.
  bump-tap:
    needs: tap-inputs
    uses: noahkiss/workflows/.github/workflows/dispatch-and-wait.yml@main
    with:
      repo: ${{ inputs.tap-repo }}
      workflow: ${{ inputs.tap-workflow }}
      inputs_json: ${{ needs.tap-inputs.outputs.json }}
      timeout_minutes: 45
    secrets:
      token: ${{ secrets.tap_token }}

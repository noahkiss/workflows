name: Node CI

# Installs dependencies with the detected package manager, then runs the named
# package scripts in order. Optionally gates on `npm audit`. `services` starts
# service containers (a database, a cache) beside the job, and `env` and
# `env_secrets` set environment variables for the scripts. `playwright`
# installs Playwright browsers before the scripts, and `artifact_path` uploads
# a report directory when the job fails.

on:
  workflow_call:
    inputs:
      node-version-file:
        description: File holding the Node version, relative to working-directory.
        required: false
        type: string
        default: .node-version
      node-version:
        description: Explicit Node version. Wins over node-version-file when set.
        required: false
        type: string
        default: ''
      package-manager:
        description: >-
          auto, npm or pnpm. auto picks pnpm when pnpm-lock.yaml sits in
          working-directory, otherwise npm.
        required: false
        type: string
        default: auto
      working-directory:
        description: Directory holding package.json.
        required: false
        type: string
        default: .
      scripts:
        description: Package script names to run, one per line, in order.
        required: false
        type: string
        default: test
      audit:
        description: >-
          Run `npm audit --omit=dev --audit-level=high` as a hard gate. npm only.
          An unreachable audit endpoint is retried, then passes with a warning.
        required: false
        type: boolean
        default: false
      services:
        description: >-
          Service containers as a JSON object, in the shape of a job's
          `services:` map, e.g.
          {"postgres": {"image": "postgres:17", "env": {"POSTGRES_PASSWORD":
          "postgres"}, "ports": ["5432:5432"], "options": "--health-cmd
          pg_isready --health-interval 5s --health-retries 10"}}. The job runs
          on the runner, so a script reaches a service at localhost on its
          mapped port. Empty starts none.
        required: false
        type: string
        default: ''
      env:
        description: >-
          Environment variables for install and the scripts, one KEY=value
          per line. Not for secrets: use env_secrets.
        required: false
        type: string
        default: ''
      playwright:
        description: >-
          Playwright browsers to install before the scripts, space-separated,
          e.g. chromium. Installs with --with-deps, through the Playwright
          version the lockfile pins, and caches ~/.cache/ms-playwright on that
          version. Empty installs none.
        required: false
        type: string
        default: ''
      artifact_path:
        description: >-
          Path to upload as an artifact, relative to working-directory, e.g.
          playwright-report/. Kept 7 days. Empty uploads nothing.
        required: false
        type: string
        default: ''
      artifact_name:
        description: >-
          Artifact name. Must be unique in the caller's run when two node-ci
          jobs upload.
        required: false
        type: string
        default: node-ci-artifact
      artifact_when:
        description: >-
          always uploads unless the run was cancelled. Any other value,
          failure by default, uploads only when a step failed.
        required: false
        type: string
        default: failure
      timeout-minutes:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 20
    secrets:
      env_secrets:
        description: >-
          Secret environment variables for install and the scripts, one
          KEY=value per line. Each value is masked in the log.
        required: false

jobs:
  ci:
    name: Node CI
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    services: ${{ fromJSON(inputs.services || '{}') }}
    concurrency:
      group: node-ci-${{ github.repository }}-${{ inputs.working-directory }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set environment
        env:
          PLAIN: ${{ inputs.env }}
          SECRET: ${{ secrets.env_secrets }}
        run: |
          set -euo pipefail
          # Each line is KEY=value. A random delimiter keeps a value from
          # ending the GITHUB_ENV block early.
          add() {
            local masked="$1" line key value delim n=0
            while IFS= read -r line; do
              n=$((n + 1))
              line="${line%$'\r'}"
              [ -n "${line//[[:space:]]/}" ] || continue
              key="${line%%=*}"
              value="${line#*=}"
              key="${key//[[:space:]]/}"
              if [ "$key" = "$line" ] || ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                # The line itself is not printed: it may hold a secret.
                echo "::error::line ${n} of $2 is not KEY=value"
                exit 1
              fi
              if [ "$masked" = 1 ] && [ -n "$value" ]; then echo "::add-mask::${value}"; fi
              delim="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$key" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
              echo "Set ${key}"
            done
          }
          add 0 env <<< "$PLAIN"
          add 1 env_secrets <<< "$SECRET"

      - name: Detect package manager
        id: pm
        env:
          REQUESTED: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          VERSION_FILE: ${{ inputs.node-version-file }}
          NODE_VERSION: ${{ inputs.node-version }}
        run: |
          set -euo pipefail

          manager="$REQUESTED"
          if [ "$manager" = auto ]; then
            if [ -f pnpm-lock.yaml ]; then manager=pnpm; else manager=npm; fi
          fi
          case "$manager" in
            npm|pnpm) ;;
            *) echo "package-manager must be auto, npm or pnpm; got '${manager}'" >&2; exit 1 ;;
          esac

          # setup-node resolves its paths from the repository root, not from
          # this step's working directory.
          prefix="${WORKING_DIRECTORY#./}"
          prefix="${prefix%/}"
          if [ "$prefix" = "." ] || [ -z "$prefix" ]; then prefix=""; else prefix="${prefix}/"; fi

          if [ "$manager" = pnpm ]; then lockfile=pnpm-lock.yaml; else lockfile=package-lock.json; fi
          cache=""
          cache_path=""
          if [ -f "$lockfile" ]; then
            cache="$manager"
            cache_path="${prefix}${lockfile}"
          else
            echo "No ${lockfile} in ${WORKING_DIRECTORY}; dependency caching is off."
          fi

          version_file=""
          if [ -z "$NODE_VERSION" ]; then
            if [ -f "$VERSION_FILE" ]; then
              version_file="${prefix}${VERSION_FILE}"
            else
              echo "Neither node-version nor ${VERSION_FILE} is available." >&2
              exit 1
            fi
          fi

          {
            echo "manager=${manager}"
            echo "cache=${cache}"
            echo "cache_path=${cache_path}"
            echo "version_file=${version_file}"
            echo "package_json=${prefix}package.json"
          } >> "$GITHUB_OUTPUT"
          echo "Package manager: ${manager}"

      - name: Set up pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ steps.pm.outputs.package_json }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ steps.pm.outputs.version_file }}
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ steps.pm.outputs.cache_path }}

      - name: Install dependencies
        env:
          MANAGER: ${{ steps.pm.outputs.manager }}
        run: |
          set -euo pipefail
          if [ "$MANAGER" = pnpm ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Read the Playwright version
        id: playwright
        if: inputs.playwright != ''
        env:
          MANAGER: ${{ steps.pm.outputs.manager }}
        run: |
          set -euo pipefail
          if [ "$MANAGER" = pnpm ]; then
            version=$(pnpm exec playwright --version)
          else
            version=$(npx --no-install playwright --version)
          fi
          version="${version##* }"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Playwright ${version}"

      - name: Cache Playwright browsers
        if: inputs.playwright != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.playwright }}

      # --with-deps installs the system libraries from apt as well; those are
      # not cached, and a cache hit skips only the browser download.
      - name: Install Playwright browsers
        if: inputs.playwright != ''
        env:
          MANAGER: ${{ steps.pm.outputs.manager }}
          BROWSERS: ${{ inputs.playwright }}
        run: |
          set -euo pipefail
          read -ra browsers <<< "$BROWSERS"
          if [ "$MANAGER" = pnpm ]; then
            pnpm exec playwright install --with-deps "${browsers[@]}"
          else
            npx --no-install playwright install --with-deps "${browsers[@]}"
          fi

      - name: Run scripts
        env:
          MANAGER: ${{ steps.pm.outputs.manager }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r script; do
            script="${script%$'\r'}"
            script="${script#"${script%%[![:space:]]*}"}"
            script="${script%"${script##*[![:space:]]}"}"
            [ -n "$script" ] || continue
            ran=1
            echo "::group::${MANAGER} run ${script}"
            "$MANAGER" run "$script"
            echo "::endgroup::"
          done <<< "$SCRIPTS"
          if [ "$ran" = 0 ]; then
            echo "No scripts requested."
          fi

      # npm exits 1 both for advisories at or above the level and for an audit
      # endpoint it could not reach (a registry 503, a reset connection). Only
      # the first says anything about the code. npm marks the second with the
      # literal line "audit endpoint returned an error" (lib/utils/audit-error.js
      # in the npm CLI); it never prints that line for a finding. So: retry on
      # the marker with backoff, pass with a warning if the endpoint stays down,
      # and fail on every other non-zero exit.
      - name: Audit dependencies
        if: inputs.audit && steps.pm.outputs.manager == 'npm'
        env:
          AUDIT_ATTEMPTS: '3'
          AUDIT_BACKOFF_SECONDS: '20'
        run: |
          # The runner starts bash with -e; the loop reads exit codes itself.
          set +e -uo pipefail
          marker='audit endpoint returned an error'
          log="$(mktemp)"
          attempt=1
          while :; do
            npm audit --omit=dev --audit-level=high 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qF "$marker" "$log"; then
              echo "::error title=npm audit::Advisories at or above high, or npm failed for another reason (exit ${status})."
              exit "$status"
            fi
            if [ "$attempt" -ge "$AUDIT_ATTEMPTS" ]; then
              echo "::warning title=npm audit skipped::The audit endpoint returned an error on all ${AUDIT_ATTEMPTS} attempts. No advisories were checked for this run."
              exit 0
            fi
            wait_for=$(( AUDIT_BACKOFF_SECONDS * attempt ))
            echo "Audit endpoint error on attempt ${attempt} of ${AUDIT_ATTEMPTS}. Retrying in ${wait_for}s."
            sleep "$wait_for"
            attempt=$(( attempt + 1 ))
          done

      - name: Report skipped audit
        if: inputs.audit && steps.pm.outputs.manager != 'npm'
        run: echo "The audit gate is npm only. Skipped."

      - name: Upload artifact
        if: >-
          inputs.artifact_path != '' && !cancelled()
          && (inputs.artifact_when == 'always' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact_path }}
          if-no-files-found: warn
          retention-days: 7

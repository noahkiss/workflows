name: GHCR build and push

# Container build, pushed to GitHub Container Registry. Builds linux/amd64 by
# default; pass `platforms` to add linux/arm64 when an ARM host runs the image.
# `push: false` builds without pushing, for pull requests. `native_runners`
# builds each platform on its own runner (arm64 on an arm64 runner, no QEMU)
# and joins the digests into one manifest list.
# `deploy_stack` asks a Komodo listener to redeploy a stack once the image is
# pushed, in the same job. `revision_command` and `skip_if_label` skip the
# build when the published image already carries the revision, for an image
# that packages another project.
# The calling job must grant `packages: write`, with `push: false` too; a
# called workflow cannot hold more token permission than its caller.

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Fully qualified image name. Empty means ghcr.io/<owner>/<repo>,
          lowercased. Expressions are not allowed in workflow_call defaults, so
          the fallback is computed in a step.
        required: false
        type: string
        default: ''
      platforms:
        description: >-
          Comma-separated buildx platform list for the pushed image. Add
          linux/arm64 only when an ARM host will run the image.
        required: false
        type: string
        default: linux/amd64
      tags:
        description: Tag rules for docker/metadata-action, one per line.
        required: false
        type: string
        default: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}
      labels:
        description: >-
          Extra labels for docker/metadata-action, one key=value per line. An
          entry replaces the generated label of the same key. Set
          org.opencontainers.image.revision when the build does not come from
          github.sha, as with a workflow_run caller that checks out
          head_sha.
        required: false
        type: string
        default: ''
      checkout_ref:
        description: >-
          Ref or SHA to check out. Empty checks out the ref that triggered the
          run. Set it to github.event.workflow_run.head_sha for workflow_run
          callers, which otherwise check out the default branch.
        required: false
        type: string
        default: ''
      context:
        description: Build context path.
        required: false
        type: string
        default: .
      dockerfile:
        description: Dockerfile path. Empty uses the buildx default.
        required: false
        type: string
        default: ''
      build_args:
        description: >-
          Build arguments for both builds, one KEY=value per line. Empty
          passes none.
        required: false
        type: string
        default: ''
      smoke_command:
        description: >-
          Shell command run against a single-arch build before the push. The
          image reference is in the IMAGE environment variable. Empty skips it.
        required: false
        type: string
        default: ''
      push:
        description: >-
          Push the image. false builds every platform and runs the smoke test,
          then pushes nothing: the pull request mode.
        required: false
        type: boolean
        default: true
      native_runners:
        description: >-
          Build each platform on a runner of its own architecture, in
          parallel: linux/amd64 on ubuntu-latest, linux/arm64 on
          ubuntu-24.04-arm. Faster than QEMU emulation for arm64. A merge job
          then pushes one manifest list with the tags. false builds every
          platform on one amd64 runner under QEMU.
        required: false
        type: boolean
        default: false
      revision_command:
        description: >-
          Shell command that prints one line: the revision this build
          packages, e.g. an upstream commit from git ls-remote. It runs after
          the checkout. `{revision}` and `{revision_short}` (its first 12
          characters) in tags, labels and build_args are replaced by it.
          Empty runs nothing and replaces nothing.
        required: false
        type: string
        default: ''
      skip_if_label:
        description: >-
          Image label key. When the image at the first tag the tag rules
          produce already carries this label with the value of
          revision_command, the build, push and deploy are skipped and the
          skipped output is true. Needs revision_command. A missing image or
          label builds. Empty never skips.
        required: false
        type: string
        default: ''
      deploy_stack:
        description: >-
          Komodo stack to redeploy after a successful push, in the same job.
          Empty deploys nothing. No deploy happens when push is false or the
          build was skipped. The caller gates the branch by passing an empty
          value off the default branch.
        required: false
        type: string
        default: ''
      listener_url:
        description: >-
          Base URL of the Komodo webhook listener, without a trailing slash.
          Required when deploy_stack is set.
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: Timeout in minutes of each build job.
        required: false
        type: number
        default: 45
    secrets:
      webhook_secret:
        description: >-
          Shared secret the Komodo listener verifies. Required when
          deploy_stack is set and push is true.
        required: false
    outputs:
      digest:
        description: Digest of the pushed image (the manifest list with native_runners). Empty when push is false.
        value: ${{ jobs.build.outputs.digest || jobs.merge.outputs.digest }}
      tags:
        description: Tags docker/metadata-action produced, one per line.
        value: ${{ jobs.build.outputs.tags || jobs.merge.outputs.tags }}
      skipped:
        description: true when skip_if_label found the revision already published, otherwise false.
        value: ${{ jobs.build.outputs.skipped || jobs.plan.outputs.skipped }}
      revision:
        description: What revision_command printed. Empty without it.
        value: ${{ jobs.build.outputs.revision || jobs.plan.outputs.revision }}

jobs:
  build:
    name: Build and push
    if: ${{ !inputs.native_runners }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: write
    # The guard lives at job level: a called workflow's jobs belong to the
    # caller's run, so a workflow-level guard here has no run to scope to. The
    # literal prefix keeps this group distinct from any caller's group.
    concurrency:
      group: ghcr-build-push-${{ github.repository }}-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      skipped: ${{ steps.skip.outputs.skip || 'false' }}
      revision: ${{ steps.rev.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Check inputs
        env:
          DEPLOY_STACK: ${{ inputs.deploy_stack }}
          LISTENER_URL: ${{ inputs.listener_url }}
          WEBHOOK_SECRET: ${{ secrets.webhook_secret }}
          PUSH: ${{ inputs.push }}
          REVISION_COMMAND: ${{ inputs.revision_command }}
          SKIP_IF_LABEL: ${{ inputs.skip_if_label }}
        run: |
          set -euo pipefail
          fail=0
          if [ -n "$DEPLOY_STACK" ]; then
            if [ -z "$LISTENER_URL" ]; then
              echo "::error::deploy_stack is set, so listener_url is required"; fail=1
            fi
            if [ "$PUSH" = true ] && [ -z "$WEBHOOK_SECRET" ]; then
              echo "::error::deploy_stack is set, so the webhook_secret secret is required. Name it under secrets: in the calling job."; fail=1
            fi
            if [ "$PUSH" != true ]; then
              echo "::notice::push is false: ${DEPLOY_STACK} will not be deployed"
            fi
          fi
          if [ -n "$SKIP_IF_LABEL" ] && [ -z "$REVISION_COMMAND" ]; then
            echo "::error::skip_if_label needs revision_command"; fail=1
          fi
          exit "$fail"

      - name: Resolve the revision
        id: rev
        env:
          REVISION_COMMAND: ${{ inputs.revision_command }}
          TAGS: ${{ inputs.tags }}
          LABELS: ${{ inputs.labels }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          revision=""
          if [ -n "$REVISION_COMMAND" ]; then
            revision=$(bash -euo pipefail -c "$REVISION_COMMAND")
            if [ -z "$revision" ] || [[ "$revision" == *$'\n'* ]]; then
              echo "::error::revision_command must print exactly one non-empty line"
              exit 1
            fi
            echo "Revision: ${revision}"
          fi
          short="${revision:0:12}"
          {
            echo "revision=${revision}"
            for name in tags labels build_args; do
              case "$name" in
                tags) value="$TAGS" ;;
                labels) value="$LABELS" ;;
                build_args) value="$BUILD_ARGS" ;;
              esac
              if [ -n "$revision" ]; then
                value="${value//\{revision_short\}/$short}"
                value="${value//\{revision\}/$revision}"
              fi
              delim="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$value" "$delim"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="${IMAGE_INPUT}"
          if [ -z "$image" ]; then
            image="ghcr.io/${REPOSITORY}"
          fi
          image=$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image}"

      - name: Log in to GHCR
        if: inputs.push || inputs.skip_if_label != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ steps.rev.outputs.tags }}
          labels: ${{ steps.rev.outputs.labels }}

      # Reads the image config only, not the layers. A missing image, a
      # missing label or any other failure reads as unpublished and builds.
      - name: Compare the published revision
        id: skip
        if: inputs.skip_if_label != ''
        env:
          META: ${{ steps.meta.outputs.json }}
          LABEL: ${{ inputs.skip_if_label }}
          REVISION: ${{ steps.rev.outputs.revision }}
        run: |
          set -euo pipefail
          FIRST_TAG=$(jq -r '.tags[0] // empty' <<< "$META")
          [ -n "$FIRST_TAG" ] || { echo "::error::the tag rules produced no tags"; exit 1; }
          published=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r --arg l "$LABEL" '.. | objects | select(has("Labels")) | .Labels[$l] // empty' \
            | head -1 || true)
          if [ "$published" = "$REVISION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${FIRST_TAG} already carries ${LABEL}=\`${REVISION}\`: build skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${FIRST_TAG} carries ${LABEL}=\`${published:-none}\`; building \`${REVISION}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up QEMU
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build amd64 image for the smoke test
        if: inputs.smoke_command != '' && steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          build-args: ${{ steps.rev.outputs.build_args }}
          push: false
          tags: ${{ steps.image.outputs.name }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the smoke test
        if: inputs.smoke_command != '' && steps.skip.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:smoke
          SMOKE_COMMAND: ${{ inputs.smoke_command }}
        run: bash -euo pipefail -c "$SMOKE_COMMAND"

      - name: Build and push
        id: push
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          build-args: ${{ steps.rev.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        if: steps.skip.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ inputs.push }}
        run: |
          set -euo pipefail
          {
            if [ "$PUSHED" = true ]; then
              echo "### Pushed image"
              echo
              echo "Digest: \`${DIGEST}\`"
            else
              echo "### Built image, not pushed"
              echo
              echo "Tags it would get:"
            fi
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A reusable workflow resolves a ./ action path against the caller's
      # checkout, so the shared action is referenced by repository.
      - name: Deploy the stack
        if: inputs.push && inputs.deploy_stack != '' && steps.skip.outputs.skip != 'true'
        uses: noahkiss/workflows/actions/komodo-deploy@main
        with:
          stack: ${{ inputs.deploy_stack }}
          listener-url: ${{ inputs.listener_url }}
          webhook-secret: ${{ secrets.webhook_secret }}

  # native_runners: plan -> one build per platform on its own runner -> merge.
  plan:
    name: Plan the platform builds
    if: inputs.native_runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.plan.outputs.image }}
      key: ${{ steps.plan.outputs.key }}
      matrix: ${{ steps.plan.outputs.matrix }}
      tags: ${{ steps.rev.outputs.tags }}
      labels: ${{ steps.rev.outputs.labels }}
      build_args: ${{ steps.rev.outputs.build_args }}
      revision: ${{ steps.rev.outputs.revision }}
      skipped: ${{ steps.skip.outputs.skip || 'false' }}
    steps:
      # The plan job checks out only to run revision_command.
      - name: Checkout
        if: inputs.revision_command != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Check inputs
        env:
          DEPLOY_STACK: ${{ inputs.deploy_stack }}
          LISTENER_URL: ${{ inputs.listener_url }}
          WEBHOOK_SECRET: ${{ secrets.webhook_secret }}
          PUSH: ${{ inputs.push }}
          REVISION_COMMAND: ${{ inputs.revision_command }}
          SKIP_IF_LABEL: ${{ inputs.skip_if_label }}
        run: |
          set -euo pipefail
          fail=0
          if [ -n "$DEPLOY_STACK" ]; then
            if [ -z "$LISTENER_URL" ]; then
              echo "::error::deploy_stack is set, so listener_url is required"; fail=1
            fi
            if [ "$PUSH" = true ] && [ -z "$WEBHOOK_SECRET" ]; then
              echo "::error::deploy_stack is set, so the webhook_secret secret is required. Name it under secrets: in the calling job."; fail=1
            fi
            if [ "$PUSH" != true ]; then
              echo "::notice::push is false: ${DEPLOY_STACK} will not be deployed"
            fi
          fi
          if [ -n "$SKIP_IF_LABEL" ] && [ -z "$REVISION_COMMAND" ]; then
            echo "::error::skip_if_label needs revision_command"; fail=1
          fi
          exit "$fail"

      - name: Resolve the revision
        id: rev
        env:
          REVISION_COMMAND: ${{ inputs.revision_command }}
          TAGS: ${{ inputs.tags }}
          LABELS: ${{ inputs.labels }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          revision=""
          if [ -n "$REVISION_COMMAND" ]; then
            revision=$(bash -euo pipefail -c "$REVISION_COMMAND")
            if [ -z "$revision" ] || [[ "$revision" == *$'\n'* ]]; then
              echo "::error::revision_command must print exactly one non-empty line"
              exit 1
            fi
            echo "Revision: ${revision}"
          fi
          short="${revision:0:12}"
          {
            echo "revision=${revision}"
            for name in tags labels build_args; do
              case "$name" in
                tags) value="$TAGS" ;;
                labels) value="$LABELS" ;;
                build_args) value="$BUILD_ARGS" ;;
              esac
              if [ -n "$revision" ]; then
                value="${value//\{revision_short\}/$short}"
                value="${value//\{revision\}/$revision}"
              fi
              delim="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "$value" "$delim"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Map each platform to a runner
        id: plan
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          image="${IMAGE_INPUT:-ghcr.io/${REPOSITORY}}"
          image=$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')
          matrix='[]'
          IFS=, read -ra list <<< "$PLATFORMS"
          for platform in "${list[@]}"; do
            platform="${platform//[[:space:]]/}"
            [ -n "$platform" ] || continue
            case "$platform" in
              linux/amd64) runner=ubuntu-latest ;;
              linux/arm64|linux/arm64/v8) runner=ubuntu-24.04-arm ;;
              *)
                echo "::error::no native runner for ${platform}; set native_runners: false to build it under QEMU"
                exit 1 ;;
            esac
            matrix=$(jq -c --arg p "$platform" --arg r "$runner" --arg s "${platform//\//-}" \
              '. + [{platform: $p, runner: $r, slug: $s}]' <<< "$matrix")
          done
          [ "$matrix" != '[]' ] || { echo "::error::platforms is empty"; exit 1; }
          # Artifact names must be unique in the caller's run, which may build
          # several images; the key ties the digests to this image.
          key=$(printf '%s' "$image" | sha256sum | cut -c1-12)
          {
            echo "image=${image}"
            echo "key=${key}"
            echo "matrix=${matrix}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${image}"
          echo "Builds: ${matrix}"

      - name: Log in to GHCR
        if: inputs.skip_if_label != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        if: inputs.skip_if_label != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.plan.outputs.image }}
          tags: ${{ steps.rev.outputs.tags }}

      # Reads the image config only, not the layers. A missing image, a
      # missing label or any other failure reads as unpublished and builds.
      - name: Compare the published revision
        id: skip
        if: inputs.skip_if_label != ''
        env:
          META: ${{ steps.meta.outputs.json }}
          LABEL: ${{ inputs.skip_if_label }}
          REVISION: ${{ steps.rev.outputs.revision }}
        run: |
          set -euo pipefail
          FIRST_TAG=$(jq -r '.tags[0] // empty' <<< "$META")
          [ -n "$FIRST_TAG" ] || { echo "::error::the tag rules produced no tags"; exit 1; }
          published=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r --arg l "$LABEL" '.. | objects | select(has("Labels")) | .Labels[$l] // empty' \
            | head -1 || true)
          if [ "$published" = "$REVISION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${FIRST_TAG} already carries ${LABEL}=\`${REVISION}\`: build skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${FIRST_TAG} carries ${LABEL}=\`${published:-none}\`; building \`${REVISION}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  native:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.skipped != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: ghcr-build-push-${{ github.repository }}-${{ inputs.image }}-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.image }}
          labels: ${{ needs.plan.outputs.labels }}

      # Each platform runs the smoke test on its own architecture.
      - name: Build the image for the smoke test
        if: inputs.smoke_command != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          build-args: ${{ needs.plan.outputs.build_args }}
          push: false
          tags: ${{ needs.plan.outputs.image }}:smoke
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Run the smoke test
        if: inputs.smoke_command != ''
        env:
          IMAGE: ${{ needs.plan.outputs.image }}:smoke
          SMOKE_COMMAND: ${{ inputs.smoke_command }}
        run: bash -euo pipefail -c "$SMOKE_COMMAND"

      # Pushed by digest only. The merge job gives the tags, once every
      # platform has built.
      - name: Build
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ needs.plan.outputs.build_args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: >-
            ${{ inputs.push
            && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.plan.outputs.image)
            || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Keep the digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ needs.plan.outputs.key }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push the manifest list
    needs: [plan, native]
    if: inputs.native_runners && inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-build-push-merge-${{ github.repository }}-${{ inputs.image }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ needs.plan.outputs.key }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ needs.plan.outputs.image }}
          tags: ${{ needs.plan.outputs.tags }}
          labels: ${{ needs.plan.outputs.labels }}

      - name: Create and push the manifest list
        id: push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$METADATA")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<< "$METADATA")
          [ "${#args[@]}" -gt 0 ] || { echo "::error::the tag rules produced no tags"; exit 1; }
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          first=$(jq -r '.tags[0]' <<< "$METADATA")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Pushed manifest list"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A reusable workflow resolves a ./ action path against the caller's
      # checkout, so the shared action is referenced by repository.
      - name: Deploy the stack
        if: inputs.deploy_stack != ''
        uses: noahkiss/workflows/actions/komodo-deploy@main
        with:
          stack: ${{ inputs.deploy_stack }}
          listener-url: ${{ inputs.listener_url }}
          webhook-secret: ${{ secrets.webhook_secret }}

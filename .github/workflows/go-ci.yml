name: Go CI

# Sets up Go from the module's version file, checks formatting and generated
# code if asked, then runs the given commands in order. Optional: tools from
# mise.toml (`mise`), one extra cache (`cache-path`, `cache-key`), another
# runner (`runner`), and whether a newer run cancels this one
# (`cancel-in-progress`). Every new input defaults to the old behaviour.

on:
  workflow_call:
    inputs:
      go-version-file:
        description: File holding the Go version (go.mod or .go-version), relative to working-directory.
        required: false
        type: string
        default: go.mod
      go-version:
        description: Explicit Go version. Wins over go-version-file when set.
        required: false
        type: string
        default: ''
      working-directory:
        description: Directory holding go.mod.
        required: false
        type: string
        default: .
      fmt:
        description: Fail when gofmt -l lists any file.
        required: false
        type: boolean
        default: true
      generate-check:
        description: Run go generate ./... and fail when it changes or adds a file.
        required: false
        type: boolean
        default: false
      commands:
        description: Commands to run, one per line, in order.
        required: false
        type: string
        default: |
          go vet ./...
          go test ./...
      timeout-minutes:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 20
      timeout-warn-percent:
        description: >-
          Warn (an annotation and a line in the job summary) when the job
          used this percent of timeout-minutes or more. 0 turns the check off.
        required: false
        type: number
        default: 75
      runner:
        description: Runner label, e.g. ubuntu-latest, ubuntu-24.04-arm or macos-26.
        required: false
        type: string
        default: ubuntu-latest
      mise:
        description: >-
          Install the tools in mise.toml (in working-directory) with
          jdx/mise-action before the commands, cached by the action.
        required: false
        type: boolean
        default: false
      cache-path:
        description: >-
          One extra path to cache, relative to working-directory, e.g. a C
          library the commands build. Needs cache-key.
        required: false
        type: string
        default: ''
      cache-key:
        description: >-
          Key for cache-path. Restored before the commands on every run; saved
          after them on the default branch only, when the key missed.
        required: false
        type: string
        default: ''
      cancel-in-progress:
        description: >-
          Cancel this job when a newer run of the same workflow reaches the
          same group. Pass an expression such as
          `github.ref != 'refs/heads/main'` to keep main runs.
        required: false
        type: boolean
        default: true
      concurrency-key:
        description: >-
          Extra text for the job's concurrency group, so several calls of
          go-ci in one run (a matrix of test shards, say) do not cancel or
          queue behind each other. Pass the matrix value, e.g. the shard.
        required: false
        type: string
        default: ''

jobs:
  ci:
    name: Go CI
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    # github.workflow is the caller's workflow name here, so two workflows of
    # one repo (CI on main and a nightly schedule) no longer share a group.
    concurrency:
      group: go-ci-${{ github.repository }}-${{ github.workflow }}-${{ inputs.working-directory }}-${{ inputs.runner }}-${{ github.ref }}${{ inputs.concurrency-key != '' && format('-{0}', inputs.concurrency-key) || '' }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # First, so the check at the end counts nearly all of the job.
      - name: Record the start time
        id: timeout-start
        shell: bash
        working-directory: .
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-go, so the Go that setup-go installs comes first on PATH even when
      # mise.toml also lists go: go-version-file stays the one source of the Go version.
      # mise saves its cache from the default branch only, like the extra cache below.
      - name: Install mise tools
        if: inputs.mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          working_directory: ${{ inputs.working-directory }}
          cache_save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'main') }}

      # setup-go caches the module and build caches, keyed on go.sum.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && format('{0}/{1}', inputs.working-directory, inputs.go-version-file) || '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Check the cache inputs
        if: inputs.cache-path != '' || inputs.cache-key != ''
        env:
          CACHE_PATH: ${{ inputs.cache-path }}
          CACHE_KEY: ${{ inputs.cache-key }}
        run: |
          if [ -z "$CACHE_PATH" ] || [ -z "$CACHE_KEY" ]; then
            echo "::error::cache-path and cache-key go together; set both or neither"
            exit 1
          fi

      - name: Restore the extra cache
        id: extra-cache
        if: inputs.cache-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - name: Check formatting
        if: inputs.fmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check generated code
        if: inputs.generate-check
        run: |
          set -euo pipefail
          go generate ./...
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "go generate changed files; run it and commit the result:" >&2
            git status --porcelain -- . >&2
            git diff -- . >&2
            exit 1
          fi

      - name: Run commands
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r command; do
            command="${command%$'\r'}"
            command="${command#"${command%%[![:space:]]*}"}"
            command="${command%"${command##*[![:space:]]}"}"
            [ -n "$command" ] || continue
            ran=1
            echo "::group::${command}"
            # stdin is the command list itself; a command that reads stdin would swallow the
            # commands after it.
            eval "${command}" </dev/null
            echo "::endgroup::"
          done <<< "$COMMANDS"
          if [ "$ran" = 0 ]; then
            echo "No commands requested."
          fi

      # Saved even when a command failed, so a slow build the commands made is
      # not lost to a failing test. Only the default branch saves, so other
      # branches and tags restore its entry and never fill the cache. A schedule
      # event's payload may carry no repository, so the ref is compared with
      # refs/heads/main then.
      - name: Check the extra cache path
        id: extra-cache-path
        if: >-
          !cancelled() && inputs.cache-key != ''
          && steps.extra-cache.outputs.cache-hit != 'true'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'main')
        env:
          CACHE_PATH: ${{ inputs.cache-path }}
        run: |
          if [ -e "$CACHE_PATH" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cache-path $CACHE_PATH does not exist; nothing to save"
          fi

      - name: Save the extra cache
        if: ${{ !cancelled() && steps.extra-cache-path.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      # Last, and it runs whatever happened before it, so a slow failing job
      # warns too. GitHub also runs it after the job timeout cancels the steps
      # (job.status is then cancelled), so a timed-out job says why. It never
      # fails the job.
      - name: Check the time against the timeout
        if: always() && inputs.timeout-warn-percent > 0
        shell: bash
        working-directory: .
        env:
          START: ${{ steps.timeout-start.outputs.epoch }}
          LIMIT: ${{ inputs.timeout-minutes }}
          WARN: ${{ inputs.timeout-warn-percent }}
          LABEL: go-ci
          INPUT: timeout-minutes
          STATUS: ${{ job.status }}
        run: |
          for v in "$START" "$LIMIT" "$WARN"; do
            case "$v" in
              '' | *[!0-9]*) echo "Timeout check skipped: start, $INPUT or the percent is not a whole number."; exit 0 ;;
            esac
          done
          [ "$LIMIT" -gt 0 ] || exit 0
          secs=$(( $(date +%s) - START ))
          pct=$(( secs * 100 / (LIMIT * 60) ))
          mins=$(( (secs + 30) / 60 ))
          echo "$LABEL used $mins of $LIMIT minutes ($pct%); job status $STATUS."
          if [ "$pct" -ge "$WARN" ]; then
            msg="$LABEL used $mins of $LIMIT minutes ($pct%). Raise $INPUT or split the job."
            if [ "$pct" -ge 100 ] && [ "$STATUS" = cancelled ]; then
              msg="$LABEL hit its $LIMIT-minute timeout and was cancelled. Raise $INPUT or split the job."
            fi
            echo "::warning title=Near the job timeout::$msg"
            echo "**Near the job timeout:** $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Selftest

# Calls each shared workflow and the komodo-deploy action against the small
# fixtures in selftest/, so a change is proven here before callers take it
# at @main. Nothing here posts to a real listener. The komodo-deploy action is
# checked against a stand-in listener on the runner. A called workflow runs on
# its own runner, which the stand-in cannot reach, so the komodo_listener_url
# secret path is checked against an echo endpoint (httpbin.org/anything) that
# answers 200 to any POST. Each of those calls also passes a listener_url input
# that cannot resolve, so a green deploy proves the secret took precedence.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - actions/**
      - selftest/**
  pull_request:
    paths:
      - .github/workflows/**
      - actions/**
      - selftest/**
  workflow_dispatch:

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: selftest/node
      scripts: test
      services: >-
        {"postgres": {"image": "postgres:17", "env": {"POSTGRES_HOST_AUTH_METHOD": "trust"},
        "ports": ["5432:5432"], "options": "--health-cmd pg_isready --health-interval 5s --health-retries 10"}}
      env: |
        PLAIN_VAR=plain
      timeout-minutes: 10
    secrets:
      env_secrets: |
        SECRET_VAR=masked-value

  node-plain:
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: selftest/node-plain
      scripts: ''
      timeout-warn-percent: 0

  node-playwright:
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      working-directory: selftest/node-playwright
      scripts: test
      playwright: chromium
      artifact_path: playwright-report/
      artifact_name: selftest-playwright-report
      artifact_when: always

  node-playwright-check:
    needs: node-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selftest-playwright-report
          path: report
      - run: test -f report/index.html

  # Defaults only: the shape every existing go-ci caller uses.
  go:
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: selftest/go

  # Two calls in one run on the same runner and ref, as a matrix of shards: with
  # concurrency-key they share no group, so neither is cancelled and both finish.
  go-shards:
    strategy:
      matrix:
        shard: [a, b]
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: selftest/go
      concurrency-key: ${{ matrix.shard }}

  # Every newer input at once, on macOS. Its runner differs from the job above,
  # so the two share no concurrency group and both finish. timeout-warn-percent 1
  # makes the timeout check warn on every run, so its warning path runs here.
  go-extras:
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: selftest/go
      runner: macos-26
      mise: true
      cache-path: .selftest-cache
      cache-key: go-ci-selftest-v1
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      timeout-minutes: 10
      timeout-warn-percent: 1
      commands: |
        jq --version
        mkdir -p .selftest-cache && echo built > .selftest-cache/out
        go test ./...

  # Every xcode-ci input on the fixture app: swift test, XcodeGen, an iOS
  # Simulator and a macOS build, the package's tests on a simulator, the cache.
  xcode:
    permissions:
      contents: read
    uses: ./.github/workflows/xcode-ci.yml
    with:
      runner: macos-26
      xcode-app: /Applications/Xcode.app
      working-directory: selftest/xcode
      swift-test-dirs: Kit
      generate: ./generate.sh
      project: Selftest.xcodeproj
      builds: |
        SelftestiOS | generic/platform=iOS Simulator
        SelftestMac | generic/platform=macOS
      tests: |
        Kit | ios-simulator | Kit
      spm-cache-key-file: selftest/xcode/Kit/Package.swift
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
      timeout-minutes: 30

  # The release actions without Apple credentials: fastlane is a stand-in,
  # so the run checks the match flags, the keychain, the xcconfig, the
  # profile check, cleanup and an unsigned archive.
  xcode-actions:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SELFTEST_MATCH_PASSPHRASE: selftest-secret
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Signing with no secrets is refused
        id: nosecrets
        continue-on-error: true
        uses: ./actions/xcode-match-signing
        with:
          team-id: ABCDE12345
          profiles: developer_id macos com.example.selftest.mac certificates-only

      - name: Certificates only, through the stand-in fastlane
        id: certs
        uses: ./actions/xcode-match-signing
        with:
          team-id: ABCDE12345
          profiles: developer_id macos com.example.selftest.mac certificates-only
          match-git-url: git@example.invalid:store.git
          match-password: ${{ env.SELFTEST_MATCH_PASSPHRASE }}
          match-deploy-key: selftest-key
          fastlane: ${{ github.workspace }}/selftest/xcode/fake-fastlane.sh
          xcconfig-extra: SELFTEST_EXTRA = yes

      - name: Check the match call, the keychain and the xcconfig
        env:
          OUTCOME: ${{ steps.nosecrets.outcome }}
          KEYCHAIN: ${{ steps.certs.outputs.keychain }}
          XCCONFIG: ${{ steps.certs.outputs.xcconfig }}
          IDENTITY: ${{ steps.certs.outputs.identity }}
          PROFILES: ${{ steps.certs.outputs.profiles }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = failure ]
          args=$(cat "$RUNNER_TEMP/fake-fastlane-args")
          echo "$args"
          for flag in 'match developer_id --readonly' '--platform macos' '--git_branch main' \
                      '--skip_docs' '--team_id ABCDE12345' '--skip_provisioning_profiles' \
                      '--app_identifier com.example.selftest.mac'; do
            grep -qF -- "$flag" <<< "$args"
          done
          [ ! -e "$(cat "$RUNNER_TEMP/fake-fastlane-key")" ]
          security show-keychain-info "$KEYCHAIN"
          [ "$IDENTITY" = "Developer ID Application" ]
          [ "$PROFILES" = '{}' ]
          cat "$XCCONFIG"
          grep -qx 'CODE_SIGN_STYLE = Manual' "$XCCONFIG"
          grep -qx 'DEVELOPMENT_TEAM = ABCDE12345' "$XCCONFIG"
          grep -qx "OTHER_CODE_SIGN_FLAGS = --keychain $KEYCHAIN --timestamp" "$XCCONFIG"
          grep -qx 'SELFTEST_EXTRA = yes' "$XCCONFIG"

      - name: A profile match did not install is refused
        id: noprofile
        continue-on-error: true
        uses: ./actions/xcode-match-signing
        with:
          team-id: ABCDE12345
          profiles: appstore ios com.example.selftest.ios
          match-git-url: git@example.invalid:store.git
          match-password: ${{ env.SELFTEST_MATCH_PASSPHRASE }}
          match-deploy-key: selftest-key
          fastlane: ${{ github.workspace }}/selftest/xcode/fake-fastlane.sh

      - name: Clean up
        id: cleanup
        if: always()
        uses: ./actions/xcode-match-signing
        with:
          cleanup: 'true'

      - name: Check the refusal and the cleanup
        env:
          OUTCOME: ${{ steps.noprofile.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = failure ]
          [ ! -e "$RUNNER_TEMP/xcode-match-signing.keychain-db" ]
          [ ! -e "$RUNNER_TEMP/xcode-match-signing.xcconfig" ]
          [ ! -e "$RUNNER_TEMP/xcode-match-signing-keys" ]

      # The lookup line xcode-match-signing writes gives each target its own profile.
      - name: Check the profile lookup
        working-directory: selftest/xcode
        run: |
          set -euo pipefail
          ./generate.sh
          for pair in 'SelftestiOS:match AppStore com.example.selftest.ios' \
                      'SelftestMac:match Direct com.example.selftest.mac macos'; do
            settings=$(xcodebuild -project Selftest.xcodeproj -target "${pair%%:*}" \
              -xcconfig signing-check.xcconfig -showBuildSettings)
            grep -qx "    PROVISIONING_PROFILE_SPECIFIER = ${pair#*:}" <<< "$settings"
          done

      - name: Archive only, ad hoc signed
        id: archive
        uses: ./actions/xcode-archive-upload
        with:
          working-directory: selftest/xcode
          project: Selftest.xcodeproj
          scheme: SelftestMac
          destination: generic/platform=macOS
          export-method: ''
          marketing-version: '2.3.4'
          build-number: '202611010000'

      - name: Check the archive
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive-path }}
        run: |
          set -euo pipefail
          plist="$ARCHIVE/Products/Applications/SelftestMac.app/Contents/Info.plist"
          [ "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = 2.3.4 ]
          [ "$(plutil -extract CFBundleVersion raw -o - "$plist")" = 202611010000 ]

      # A second call takes the first one's archive and builds nothing.
      - name: Reuse the archive
        id: again
        uses: ./actions/xcode-archive-upload
        with:
          archive-path: ${{ steps.archive.outputs.archive-path }}
          export-method: ''

      - name: Check the reuse
        env:
          FIRST: ${{ steps.archive.outputs.archive-path }}
          SECOND: ${{ steps.again.outputs.archive-path }}
          LOGS: ${{ steps.again.outputs.log-dir }}
        run: |
          set -euo pipefail
          [ "$FIRST" = "$SECOND" ]
          [ -d "$SECOND/Products/Applications/SelftestMac.app" ]
          # Only the first call's archive log: the reuse ran no xcodebuild
          # and kept that log.
          [ "$(ls -A "$LOGS")" = archive.log ]

  rust:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: selftest/rust
      fmt: true

  # The crate's .cargo/config.toml makes wasm32-wasip1 the build target.
  rust-wasm:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-ci.yml
    with:
      working-directory: selftest/rust-wasm
      targets: wasm32-wasip1
      build-args: --release --locked
      test: false

  image-pr:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-build-push.yml
    with:
      image: ghcr.io/noahkiss/workflows-selftest
      context: selftest/docker
      platforms: linux/amd64,linux/arm64
      push: false
      smoke_command: docker run --rm "$IMAGE"
      # push is false, so this must not post anything.
      deploy_stack: selftest
      listener_url: https://listener.invalid/listener/github

  image-pr-native:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-build-push.yml
    with:
      image: ghcr.io/noahkiss/workflows-selftest-pr
      context: selftest/docker
      platforms: linux/amd64,linux/arm64
      push: false
      native_runners: true
      smoke_command: docker run --rm "$IMAGE"

  image-native:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-build-push.yml
    with:
      image: ghcr.io/noahkiss/workflows-selftest
      context: selftest/docker
      platforms: linux/amd64,linux/arm64
      native_runners: true
      tags: |
        type=raw,value=selftest
      smoke_command: docker run --rm "$IMAGE"
      # Deploy from the merge job, URL from the secret.
      deploy_stack: selftest
      listener_url: https://listener.invalid/listener/github
    secrets:
      webhook_secret: selftest-secret
      komodo_listener_url: https://httpbin.org/anything/listener/github

  image-check:
    needs: image-native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - env:
          DIGEST: ${{ needs.image-native.outputs.digest }}
          TAGS: ${{ needs.image-native.outputs.tags }}
        run: |
          set -euo pipefail
          echo "digest=$DIGEST tags=$TAGS"
          [ -n "$DIGEST" ]
          docker buildx imagetools inspect ghcr.io/noahkiss/workflows-selftest:selftest

  # revision_command + skip_if_label: the first build publishes a revision
  # unique to this run attempt; the two after it must find it and skip.
  image-rev:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-build-push.yml
    with:
      image: ghcr.io/noahkiss/workflows-selftest-rev
      context: selftest/docker
      revision_command: echo "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      tags: |
        type=raw,value=rev
        type=raw,value=r-{revision_short}
      labels: |
        selftest.revision={revision}
      build_args: |
        REV={revision}
      smoke_command: docker run --rm "$IMAGE" | grep -q "rev run-"
      # Deploy from the build job, URL from the secret.
      deploy_stack: selftest
      listener_url: https://listener.invalid/listener/github
    secrets:
      webhook_secret: selftest-secret
      komodo_listener_url: https://httpbin.org/anything/listener/github

  image-rev-skip:
    needs: image-rev
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-build-push.yml
    with:
      image: ghcr.io/noahkiss/workflows-selftest-rev
      context: selftest/docker
      revision_command: echo "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      skip_if_label: selftest.revision
      tags: |
        type=raw,value=rev
      labels: |
        selftest.revision={revision}
      # A skipped build must not deploy, so this must not post anything.
      deploy_stack: selftest
      listener_url: https://listener.invalid/listener/github
    secrets:
      webhook_secret: unused

  image-rev-native-skip:
    needs: image-rev
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-build-push.yml
    with:
      image: ghcr.io/noahkiss/workflows-selftest-rev
      context: selftest/docker
      native_runners: true
      revision_command: echo "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      skip_if_label: selftest.revision
      tags: |
        type=raw,value=rev

  image-rev-check:
    needs: [image-rev, image-rev-skip, image-rev-native-skip]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - env:
          BUILT: ${{ needs.image-rev.outputs.skipped }}
          SKIP: ${{ needs.image-rev-skip.outputs.skipped }}
          NATIVE_SKIP: ${{ needs.image-rev-native-skip.outputs.skipped }}
          REVISION: ${{ needs.image-rev.outputs.revision }}
          SKIP_REVISION: ${{ needs.image-rev-native-skip.outputs.revision }}
          TAGS: ${{ needs.image-rev.outputs.tags }}
        run: |
          set -euo pipefail
          echo "built=$BUILT skip=$SKIP native_skip=$NATIVE_SKIP revision=$REVISION"
          [ "$BUILT" = false ]
          [ "$SKIP" = true ]
          [ "$NATIVE_SKIP" = true ]
          [ "$REVISION" = "run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]
          [ "$SKIP_REVISION" = "$REVISION" ]
          grep -qx "ghcr.io/noahkiss/workflows-selftest-rev:r-${REVISION:0:12}" <<< "$TAGS"

  # The secret wins over the input.
  komodo-deploy-secret:
    permissions: {}
    uses: ./.github/workflows/komodo-deploy.yml
    with:
      stack: selftest
      listener_url: https://listener.invalid/listener/github
    secrets:
      webhook_secret: selftest-secret
      komodo_listener_url: https://httpbin.org/anything/listener/github

  # Existing callers pass only the input; that must keep working.
  komodo-deploy-input:
    permissions: {}
    uses: ./.github/workflows/komodo-deploy.yml
    with:
      stack: selftest
      listener_url: https://httpbin.org/anything/listener/github
    secrets:
      webhook_secret: selftest-secret

  komodo-deploy-action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the stand-in listener
        run: |
          set -euo pipefail
          nohup python3 selftest/komodo/listener.py "$RUNNER_TEMP/verdict" > "$RUNNER_TEMP/listener.log" 2>&1 &
          for _ in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/listener.log"
          exit 1

      - name: Deploy with the right secret
        uses: ./actions/komodo-deploy
        with:
          stack: selftest
          listener-url: http://127.0.0.1:8765/listener/github
          webhook-secret: selftest-secret

      - name: Check the listener accepted it
        run: test "$(cat "$RUNNER_TEMP/verdict")" = ok

      - name: Deploy with a wrong secret
        id: wrong
        continue-on-error: true
        uses: ./actions/komodo-deploy
        with:
          stack: selftest
          listener-url: http://127.0.0.1:8765/listener/github
          webhook-secret: wrong-secret

      - name: Deploy with no secret
        id: empty
        continue-on-error: true
        uses: ./actions/komodo-deploy
        with:
          stack: selftest
          listener-url: http://127.0.0.1:8765/listener/github
          webhook-secret: ''

      - name: Deploy with no listener URL
        id: nourl
        continue-on-error: true
        uses: ./actions/komodo-deploy
        with:
          stack: selftest
          listener-url: ''
          webhook-secret: selftest-secret

      - name: Check all three were refused
        env:
          WRONG: ${{ steps.wrong.outcome }}
          EMPTY: ${{ steps.empty.outcome }}
          NOURL: ${{ steps.nourl.outcome }}
        run: |
          set -euo pipefail
          echo "wrong=$WRONG empty=$EMPTY nourl=$NOURL"
          [ "$WRONG" = failure ]
          [ "$EMPTY" = failure ]
          [ "$NOURL" = failure ]
          test "$(cat "$RUNNER_TEMP/verdict")" = bad

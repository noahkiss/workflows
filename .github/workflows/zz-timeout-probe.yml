name: Timeout probe (temporary)
on:
  pull_request:
    paths: [.github/workflows/zz-timeout-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    continue-on-error: true
    steps:
      - run: echo "TIMEOUT_WARN_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: sleep 150
      - name: Runs after the timeout?
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "always step ran, status=$JOB_STATUS, elapsed=$(( $(date +%s) - TIMEOUT_WARN_START ))s"
          echo "::warning::probe always step ran (status $JOB_STATUS)"
          echo "probe always step ran (status $JOB_STATUS)" >> "$GITHUB_STEP_SUMMARY"

# Selftest fixture for xcode-ci.yml: one SwiftUI app for iOS and macOS on a
# local Swift package. XcodeGen makes the project; it is not committed.
name: Selftest
options:
  bundleIdPrefix: com.example.selftest
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Kit:
    path: Kit
targets:
  SelftestiOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.selftest.ios
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SelftestMac:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: Kit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.selftest.mac
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
